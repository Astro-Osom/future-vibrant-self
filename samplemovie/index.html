<style>
  :root {
    --text: #eff2f7;
    --dim: #99a2b2;
    --faint: #59616f;
    --teal: #1EC8C8;
    --pink: #E84B8A;
    --gold: #F0A500;
    --sans: "Montserrat", -apple-system, sans-serif;
    --grad: linear-gradient(90deg, var(--teal), var(--pink), var(--gold));
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: #000; color: var(--text);
    font-family: var(--sans); -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 28px 18px 40px;
  }
  .lockup { text-align: center; margin-bottom: 22px; }
  .wordmark {
    font-family: "League Spartan", var(--sans); font-weight: 700;
    font-size: clamp(22px, 5vw, 30px); letter-spacing: 0.01em;
    background: var(--grad); -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    text-decoration: none; display: inline-block;
  }
  .tagline {
    font-family: "League Spartan", var(--sans); font-weight: 500;
    font-size: clamp(11px, 2.6vw, 14px); letter-spacing: 0.04em;
    color: var(--text); margin-top: 6px;
  }
  .film { width: min(1000px, 96vw); }
  .film + .film { margin-top: 48px; }
  .label {
    font-family: "League Spartan", var(--sans); font-weight: 600;
    font-size: clamp(18px, 4.2vw, 24px); letter-spacing: 0.01em;
    color: var(--text); margin: 0 0 12px 4px;
  }
  .stage {
    width: 100%;
    border-radius: 14px; overflow: hidden;
    background: #000; box-shadow: 0 30px 90px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
  }
  video {
    display: block; width: 100%; height: auto; background: #000;
    aspect-ratio: 16 / 9;
  }
  .caption {
    margin-top: 16px; text-align: center;
    font-weight: 300; font-size: 12.5px; letter-spacing: 0.05em; color: var(--faint);
  }
</style>
</head>
<body>

  <div class="lockup">
    <a class="wordmark" href="https://fvsmovies.com">Future Vibrant Self</a>
    <div class="tagline">Storytelling Made Simple</div>
  </div>

  <section class="film">
    <h2 class="label">Frank&rsquo;s story</h2>
    <div class="stage">
      <video data-film="frank" controls playsinline preload="metadata" poster="poster.jpg" controlslist="nodownload">
        <source src="fvs-0056.mp4" type="video/mp4">
        Your browser doesn&rsquo;t support embedded video. <a href="fvs-0056.mp4" style="color:var(--teal)">Open the film directly</a>.
      </video>
    </div>
  </section>

  <section class="film">
    <h2 class="label">Jimmy&rsquo;s story</h2>
    <div class="stage">
      <video data-film="jimmy" controls playsinline preload="metadata" poster="jimmy-poster.jpg" controlslist="nodownload">
        <source src="jimmy.mp4" type="video/mp4">
        Your browser doesn&rsquo;t support embedded video. <a href="jimmy.mp4" style="color:var(--teal)">Open the film directly</a>.
      </video>
    </div>
  </section>

<script>
  // only one film plays at a time
  const vids = document.querySelectorAll('video');
  vids.forEach(v => v.addEventListener('play', () => vids.forEach(o => { if (o !== v) o.pause(); })));
</script>

<script>
  // View counter (Frank, Nov 18): per visit and per film -- plays, time watched, furthest point, finished; plus
  // time zone, language, screen size, browser and the referring page. No name, no IP, no cookies (one random id per tab).
  // A link code (?r=) says which shared link the visit came from; names stay off the site and the database.
  (function () {
    var TRACK = 'https://tffhhfbuwahtavaghugj.supabase.co/functions/v1/film-track';
    var MAX_MS = 6 * 60 * 60 * 1000;
    var r = '';
    try { r = (new URLSearchParams(location.search).get('r') || '').toLowerCase(); } catch (e) {}
    if (!/^[a-z0-9]{6,16}$/.test(r)) r = '';
    var sid = '', abc = 'abcdefghijklmnopqrstuvwxyz0123456789', buf = new Uint8Array(20);
    try { crypto.getRandomValues(buf); } catch (e) { for (var i = 0; i < 20; i++) buf[i] = Math.floor(Math.random() * 256); }
    for (var j = 0; j < 20; j++) sid += abc[buf[j] % 36];
    var q = 0, tz = '';
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
    var films = { page: { plays: 0, ms: 0, since: 0, pos: 0, dur: 0, ended: 0, fromEnd: false, el: null } };

    function watched(f) { return Math.min(MAX_MS, Math.round(f.ms + (f.since ? Date.now() - f.since : 0))); }
    function send(name, ev) {
      var f = films[name];
      if (f.el) { f.pos = Math.max(f.pos, Math.floor(f.el.currentTime || 0)); if (isFinite(f.el.duration)) f.dur = Math.floor(f.el.duration); }
      q += 1;
      var body = JSON.stringify({ v: 1, sid: sid, r: r, film: name, q: q, ev: ev, plays: f.plays, ms: watched(f),
        pos: Math.min(36000, f.pos), dur: Math.min(36000, f.dur), ended: f.ended, ua: navigator.userAgent,
        vw: window.innerWidth, vh: window.innerHeight, tz: tz, lang: navigator.language || '', ref: document.referrer || '' });
      try { if (navigator.sendBeacon && navigator.sendBeacon(TRACK, new Blob([body], { type: 'text/plain' }))) return; } catch (e) {}
      try { fetch(TRACK, { method: 'POST', body: body, keepalive: true, mode: 'no-cors', headers: { 'Content-Type': 'text/plain' } }); } catch (e) {}
    }
    function stop(f) { if (f.since) { f.ms += Date.now() - f.since; f.since = 0; } }

    document.querySelectorAll('video[data-film]').forEach(function (v) {
      var name = v.getAttribute('data-film');
      var f = films[name] = { plays: 0, ms: 0, since: 0, pos: 0, dur: 0, ended: 0, fromEnd: false, el: v };
      v.addEventListener('play', function () {
        if (f.plays === 0 || f.fromEnd || (v.currentTime || 0) < 1) f.plays += 1;   // a resume is not a new play
        f.fromEnd = false;
        if (!f.since) f.since = Date.now();
        send(name, 'play');
      });
      v.addEventListener('pause', function () { stop(f); if (!v.ended) send(name, 'pause'); });
      v.addEventListener('ended', function () { stop(f); f.ended += 1; f.fromEnd = true; send(name, 'ended'); });
      v.addEventListener('timeupdate', function () { f.pos = Math.max(f.pos, Math.floor(v.currentTime || 0)); });
    });

    send('page', 'open');
    setInterval(function () {   // every 15 s while a film is playing
      for (var n in films) if (films[n].since) send(n, 'progress');
    }, 15000);
    function flush(ev) { for (var n in films) if (n === 'page' || films[n].plays > 0) send(n, ev); }
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flush('hide'); });
    window.addEventListener('pagehide', function () { for (var n in films) stop(films[n]); flush('close'); });
  })();
</script>

</body>
</html>
