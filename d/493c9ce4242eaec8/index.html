<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin">
<title>FVS Movies — Pitch Deck</title>
<style>
  :root { --bg: #0b0a08; --fg: #efe6d2; --dim: rgba(239,230,210,.6); --line: rgba(239,230,210,.22); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: Montserrat, system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px 16px 0; }
  #frame { position: relative; aspect-ratio: 16 / 9; width: min(100%, calc((100dvh - 72px) * 16 / 9));
    background: #000; box-shadow: 0 10px 40px rgba(0,0,0,.6); touch-action: pan-y; }
  #frame img { position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    user-select: none; -webkit-user-select: none; -webkit-user-drag: none; }
  .hot { position: absolute; display: block; z-index: 2; }
  .hot:focus-visible { outline: 2px solid #00b0f0; }
  #bar { display: flex; align-items: center; justify-content: center; gap: 18px; height: 60px; font-size: 14px; color: var(--dim); }
  #bar button { background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 999px;
    width: 44px; height: 44px; font-size: 20px; line-height: 1; cursor: pointer; }
  #bar button:disabled { opacity: .3; cursor: default; }
  #count { min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main id="stage"><div id="frame"><img id="slide" alt="" draggable="false"></div></main>
<nav id="bar" aria-label="Slides">
  <button id="prev" type="button" aria-label="Previous slide">&#8249;</button>
  <span id="count" aria-live="polite"></span>
  <button id="next" type="button" aria-label="Next slide">&#8250;</button>
</nav>
<script>
(function () {
  'use strict';
  var CFG = { deck: '2026-11-13b', n: 16, track: 'https://tffhhfbuwahtavaghugj.supabase.co/functions/v1/deck-track', links: {"2":[{"url":"https://youtu.be/yqSFod3LsCA","label":"Watch the trailer","x":54.96,"y":29.93,"w":39.08,"h":39.05},{"url":"https://www.linkedin.com/in/frankiereina/","label":"LinkedIn profile","x":55.0,"y":69.98,"w":39.0,"h":4.07}],"11":[{"url":"https://www.jimgoodman.com/","label":"https://www.jimgoodman.com/","x":3.44,"y":72.22,"w":30.21,"h":2.78},{"url":"https://www.jeffreychernick.com/","label":"https://www.jeffreychernick.com/","x":34.9,"y":72.22,"w":30.21,"h":2.78},{"url":"https://www.linkedin.com/in/tomialapaattikoski/","label":"LinkedIn profile","x":66.35,"y":72.22,"w":30.21,"h":2.78}],"16":[{"url":"https://fvsmovies.com/samplemovie/","label":"Sample movies","x":25.88,"y":40.86,"w":11.76,"h":20.91},{"url":"https://fvsmovies.com/samplemovie/","label":"Sample movies","x":16.13,"y":66.18,"w":31.27,"h":3.52}]} };
  var KEY = 'fvs_deck_' + CFG.deck;
  var IDLE_MS = 10 * 60 * 1000;           // no input for 10 minutes: stop counting until the next input
  var TICK_MS = 15 * 1000;                // send the running totals every 15 s while the page is visible

  var params = new URLSearchParams(location.search);
  var raw = (params.get('r') || '').toLowerCase();
  var token = /^[a-z0-9]{6,16}$/.test(raw) ? raw : '';

  function newId() {
    var a = 'abcdefghijklmnopqrstuvwxyz0123456789', b = crypto.getRandomValues(new Uint8Array(20)), s = '';
    for (var i = 0; i < b.length; i++) s += a[b[i] % 36];
    return s;
  }
  // One session per browser tab. A reload in the same tab continues it (sessionStorage); a new tab starts a new one.
  var st = null;
  try { st = JSON.parse(sessionStorage.getItem(KEY) || 'null'); } catch (e) {}
  if (!st || st.token !== token || !/^[a-z0-9]{20}$/.test(st.sid) || !Array.isArray(st.ms) || st.ms.length !== CFG.n) {
    st = { sid: newId(), token: token, q: 0, cur: 1, max: 1, ms: new Array(CFG.n).fill(0) };
  }
  function save() { try { sessionStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }

  var lastInput = performance.now(), lastTick = performance.now(), dirty = true;
  function counting(now) { return document.visibilityState === 'visible' && now - lastInput < IDLE_MS; }
  function accrue() {
    var now = performance.now(), d = now - lastTick;
    lastTick = now;
    if (d > 0 && d < 5000 && counting(now)) { st.ms[st.cur - 1] += d; dirty = true; }  // gaps over 5 s (sleep) are not counted
  }

  function send(ev) {
    accrue();
    st.q += 1; save(); dirty = false;
    if (!CFG.track || CFG.track.indexOf('__') === 0) return;
    var ref = '';
    try { ref = document.referrer ? new URL(document.referrer).hostname : ''; } catch (e) {}
    var tz = '';
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
    var body = JSON.stringify({
      v: 1, sid: st.sid, r: st.token, deck: CFG.deck, q: st.q, ev: ev, cur: st.cur, max: st.max,
      ms: st.ms.map(function (x) { return Math.round(x); }),
      ua: (navigator.userAgent || '').slice(0, 300), vw: innerWidth, vh: innerHeight, tz: tz,
      lang: (navigator.language || '').slice(0, 20), ref: ref.slice(0, 100)
    });
    try { if (navigator.sendBeacon && navigator.sendBeacon(CFG.track, new Blob([body], { type: 'text/plain' }))) return; } catch (e) {}
    try { fetch(CFG.track, { method: 'POST', body: body, keepalive: true, mode: 'no-cors', headers: { 'Content-Type': 'text/plain' } }); } catch (e) {}
  }

  var img = document.getElementById('slide'), frame = document.getElementById('frame');
  var prev = document.getElementById('prev'), next = document.getElementById('next'), count = document.getElementById('count');
  function src(k) { return 's/' + (k < 10 ? '0' : '') + k + '.webp?v=' + CFG.deck; }
  function render() {
    img.src = src(st.cur);
    img.alt = 'Slide ' + st.cur + ' of ' + CFG.n;
    count.textContent = st.cur + ' / ' + CFG.n;
    prev.disabled = st.cur === 1; next.disabled = st.cur === CFG.n;
    Array.prototype.slice.call(frame.querySelectorAll('.hot')).forEach(function (a) { a.remove(); });
    (CFG.links[st.cur] || []).forEach(function (l) {
      var a = document.createElement('a');
      a.className = 'hot'; a.href = l.url; a.target = '_blank'; a.rel = 'noopener';
      a.setAttribute('aria-label', l.label || l.url);
      a.style.left = l.x + '%'; a.style.top = l.y + '%'; a.style.width = l.w + '%'; a.style.height = l.h + '%';
      a.addEventListener('click', function (e) { e.stopPropagation(); send('link'); });
      frame.appendChild(a);
    });
    [st.cur - 1, st.cur + 1].forEach(function (k) { if (k >= 1 && k <= CFG.n) { var p = new Image(); p.src = src(k); } });
  }
  function go(k) {
    k = Math.max(1, Math.min(CFG.n, k));
    if (k === st.cur) return;
    accrue();
    st.cur = k; st.max = Math.max(st.max, k);
    render(); send('slide');
  }

  function poke() { var now = performance.now(); if (now - lastInput >= IDLE_MS) lastTick = now; lastInput = now; }
  ['pointerdown', 'pointermove', 'wheel', 'touchstart', 'scroll'].forEach(function (t) { addEventListener(t, poke, { passive: true }); });
  prev.addEventListener('click', function () { go(st.cur - 1); });
  next.addEventListener('click', function () { go(st.cur + 1); });
  frame.addEventListener('click', function (e) {
    var r = frame.getBoundingClientRect();
    go(e.clientX - r.left < r.width * 0.3 ? st.cur - 1 : st.cur + 1);
  });
  addEventListener('keydown', function (e) {
    poke();
    var k = e.key;
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === ' ') { e.preventDefault(); go(st.cur + 1); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp') { e.preventDefault(); go(st.cur - 1); }
    else if (k === 'Home') { e.preventDefault(); go(1); }
    else if (k === 'End') { e.preventDefault(); go(CFG.n); }
  });
  var x0 = null;
  frame.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  frame.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 40) { e.preventDefault(); go(st.cur + (dx < 0 ? 1 : -1)); }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') send('hide'); else { lastTick = performance.now(); }
  });
  addEventListener('pagehide', function () { send('close'); });
  setInterval(accrue, 1000);
  setInterval(function () { if (dirty && document.visibilityState === 'visible') send('tick'); }, TICK_MS);

  render();
  send('open');
})();
</script>
</body>
</html>
